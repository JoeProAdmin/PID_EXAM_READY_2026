<!DOCTYPE html>
<html lang="fr"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}">
<head>
    <title>Nouvelle représentation</title>
</head>
<body>
<div class="container">
    <div layout:fragment="content">

        <h1>Nouvelle représentation</h1>

        <p sec:authorize="!hasRole('ADMIN')">
            Cette opération est réservée aux administrateurs.
        </p>

        <div th:if="${error}"
             role="alert"
             style="color: #b00020; font-weight: bold; margin-bottom: 15px;">
            <span th:text="${error}">
                Une erreur empêche l'ajout de la représentation.
            </span>
        </div>

        <form sec:authorize="hasRole('ADMIN')"
              th:action="@{/representations/create}"
              method="post">

            <div>
                <label for="showId">Spectacle :</label>

                <select id="showId" name="showId" required>
                    <option value="">-- Choisir un spectacle --</option>

                    <option th:each="show : ${shows}"
                            th:value="${show.id}"
                            th:text="${show.title}"
                            th:selected="${selectedShowId != null
                                and #strings.equals(selectedShowId, show.id)}">
                    </option>
                </select>
            </div>

            <div>
                <label for="roomId">Salle :</label>

                <select id="roomId" name="roomId" required>
                    <option value="">-- Choisir une salle --</option>

                    <option th:each="room : ${rooms}"
                            th:value="${room.id}"
                            th:text="${room.location.designation + ' - ' + room.name}"
                            th:selected="${selectedRoomId != null
                                and selectedRoomId == room.id}">
                    </option>
                </select>
            </div>

            <div>
                <label for="when">Date et heure :</label>

                <input id="when"
                       type="datetime-local"
                       name="when"
                       th:value="${selectedWhen}"
                       required>
            </div>

            <div>
                <button type="submit">
                    Ajouter
                </button>

                <a th:href="@{/representations}">
                    Annuler
                </a>
            </div>

        </form>

    </div>
</div>
</body>
</html>
