<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
	<title>Fiche d'une représentation</title>
</head>
<body>
<div class="container">
	<div layout:fragment="content">

		<article>

			<h1 th:text="'Représentation du ' + ${date} + ' à ' + ${heure}">
				Représentation du 15/01/2020 à 13:30
			</h1>

			<p>
				<strong>Spectacle :</strong>
				<span th:text="${representation.show.title}">
                    Ayiti
                </span>
			</p>

			<p>
				<strong>Salle :</strong>
				<span th:text="${representation.room.name}">
                    Grande salle
                </span>
			</p>

			<p>
				<strong>Lieu :</strong>
				<span th:text="${representation.room.location.designation}">
                    Espace Delvaux
                </span>
			</p>

			<p>
				<strong>Capacité :</strong>
				<span th:text="${representation.room.seats}">
                    300
                </span>
				places
			</p>

		</article>

		<nav>
			<a th:href="@{/representations}">
				Retour à l'index
			</a>
		</nav>

	</div>
</div>
</body>
</html>
