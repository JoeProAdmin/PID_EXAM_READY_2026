<!DOCTYPE html>
<html lang="fr"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}">
<head><title>Spectacles sans mot-clé</title></head>
<body>
<div class="container">
    <div layout:fragment="content">
        <h1>Spectacles ne possédant pas le mot-clé « <span th:text="${tag}">tag</span> »</h1>
        <ul th:unless="${#lists.isEmpty(shows)}">
            <li th:each="show : ${shows}">
                <a th:href="@{/shows/{id}(id=${show.id})}" th:text="${show.title}">Spectacle</a>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(shows)}">Tous les spectacles possèdent ce mot-clé.</p>
        <p><a th:href="@{/shows}">Retour aux spectacles</a></p>
    </div>
</div>
</body>
</html>
