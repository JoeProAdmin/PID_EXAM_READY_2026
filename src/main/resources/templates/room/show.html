<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Fiche d'une salle</title>
</head>
<body>
<div class="container">
    <div layout:fragment="content">
        <h1 th:text="${room.name}">Nom de la salle</h1>

        <p>
            <strong>Nombre de places :</strong>
            <span th:text="${room.seats}">100</span>
        </p>

        <p>
            <strong>Lieu :</strong>
            <span th:if="${room.location}" th:text="${room.location.designation}">Lieu</span>
            <em th:unless="${room.location}">à déterminer</em>
        </p>

        <h2>Liste des représentations</h2>
        <ul th:unless="${#lists.isEmpty(room.representations)}">
            <li th:each="representation : ${room.representations}">
                <span th:text="${#temporals.format(representation.when,'dd-MM-yyyy HH:mm')}">12-10-2012 13:30</span>
                -
                <span th:text="${representation.show.title}">Spectacle</span>
            </li>
        </ul>

        <p th:if="${#lists.isEmpty(room.representations)}">Aucune représentation.</p>

        <nav>
            <a th:href="@{/rooms/{id}/shows(id=${room.id})}">Spectacles de cette salle</a>
            -
            <a th:href="@{/rooms}">Retour à l'index</a>
        </nav>
    </div>
</div>
</body>
</html>
