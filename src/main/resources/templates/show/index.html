<!DOCTYPE html>
<html lang="fr"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}">
<head><title>Liste des spectacles</title></head>
<body>
<div class="container">
    <div layout:fragment="content">
        <h1 th:text="${title}">Liste des spectacles</h1>

        <form th:action="@{/shows}" method="get">
            <label for="tag">Rechercher par mot-clé :</label>
            <input id="tag" name="tag" type="search" maxlength="30" th:value="${selectedTag}">
            <button type="submit">Rechercher</button>
            <a th:if="${!selectedTag.isEmpty()}" th:href="@{/shows}">Réinitialiser</a>
        </form>

        <p th:if="${!selectedTag.isEmpty()}">
            <span th:text="${resultCount}">0</span>
            résultat(s) pour le mot-clé « <span th:text="${selectedTag}">tag</span> ».
        </p>

        <ul th:unless="${#lists.isEmpty(shows)}">
            <li th:each="show : ${shows}">
                <span th:text="${show.title}">Ayiti</span>
                <span th:if="${show.bookable}" th:text="${show.price} + ' €'">9.99 €</span>
                <span th:if="${#lists.size(show.representations)==1}">- 1 représentation</span>
                <span th:if="${#lists.size(show.representations)>1}"
                      th:text="|- ${#lists.size(show.representations)} représentations|">- 2 représentations</span>
                <em th:if="${#lists.size(show.representations)==0}">aucune représentation</em>
                <a th:href="@{/shows/{id}(id=${show.id})}">View</a>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(shows)}">Aucun spectacle trouvé.</p>
    </div>
</div>
</body>
</html>
