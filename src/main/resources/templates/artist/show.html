<!DOCTYPE html>
<html lang="fr"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="~{layouts/main}">
<head>
    <title>Fiche d'un artiste</title>
</head>
<body>
<div class="container">
    <div layout:fragment="content">
        <h1 th:text="|${artist.firstname} ${artist.lastname}|">Bob Sull</h1>

        <h2>Liste des types</h2>
        <ul th:unless="${#lists.isEmpty(artist.types)}">
            <li th:each="type : ${artist.types}" th:text="${type.type}">Type</li>
        </ul>

        <hr>
        <h2>Troupe</h2>
        <div th:if="${artist.troupe != null}">
            <p><strong>Nom :</strong> <span th:text="${artist.troupe.name}">Nom de la troupe</span></p>
            <img th:if="${artist.troupe.logoUrl != null and !artist.troupe.logoUrl.isEmpty()}"
                 th:src="${artist.troupe.logoUrl}" width="50" alt="Logo de la troupe"/>
        </div>
        <div th:if="${artist.troupe == null}">
            <p>Non affilié</p>
        </div>

        <section th:if="${isActor}">
            <h2>Langues parlées</h2>
            <ul th:unless="${#lists.isEmpty(artist.artistLanguages)}"><li th:each="al : ${artist.artistLanguages}"><span th:text="${al.language.language}">Français</span> : <span th:text="${al.level}">COURANT</span></li></ul>
            <p th:if="${#lists.isEmpty(artist.artistLanguages)}">Aucune langue enregistrée.</p>
            <div sec:authorize="hasRole('ADMIN')">
                <h3>Ajouter une langue</h3><p th:if="${languageSuccess}" th:text="${languageSuccess}"></p><p th:if="${languageError}" th:text="${languageError}"></p>
                <form th:action="@{/artists/{id}/languages(id=${artist.id})}" method="post"><select name="languageId"><option th:each="language:${languages}" th:value="${language.id}" th:text="${language.language}">Langue</option></select><select name="level"><option th:each="level:${levels}" th:value="${level}" th:text="${level}">Niveau</option></select><button type="submit">Ajouter</button></form>
            </div>
        </section>

        <div sec:authorize="hasRole('ADMIN')">
            <hr>
            <h3>Modifier l'affiliation</h3>
            <p th:if="${troupeSuccess}" th:text="${troupeSuccess}"></p>
            <p th:if="${troupeError}" th:text="${troupeError}"></p>
            <form th:action="@{/artists/{id}/troupe(id=${artist.id})}" method="post">
                <label for="troupeId">Troupe</label>
                <select id="troupeId" name="troupeId">
                    <option value="" th:selected="${artist.troupe == null}">Non affilié</option>
                    <option th:each="troupe : ${troupes}"
                            th:value="${troupe.id}"
                            th:text="${troupe.name}"
                            th:selected="${artist.troupe != null and artist.troupe.id == troupe.id}">
                        Nom de la troupe
                    </option>
                </select>
                <button type="submit">Enregistrer</button>
            </form>
        </div>

        <hr>
        <div class="actions">
            <a th:href="@{/artists/{id}/edit(id=${artist.id})}">Edit</a>
            <form th:id="|deleteForm-${artist.id}|" th:action="@{/artists/{id}(id=${artist.id})}" th:method="delete">
                <a href="#" th:onclick="|if(confirm('Confirm delete artist #${artist.id}')) document.getElementById('deleteForm-${artist.id}').submit(); return false;|">Delete</a>
            </form>
        </div>
        <nav><a th:href="@{/artists}">Retour à l'index</a></nav>
    </div>
</div>
</body>
</html>
